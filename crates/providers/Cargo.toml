#:tombi toml-version = "v1.0.0"

[package]
name                   = "runner-run-providers"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description            = "Provider declarations of runner-run; internal, no stable API"
readme                 = "../../README.md"
repository.workspace   = true
license.workspace      = true
keywords               = ["automation", "build-tool", "cli", "task-runner"]
categories             = ["command-line-utilities", "development-tools"]

[lib]
name = "runner_providers"

[dependencies]
runner-run-core.workspace    = true
runner-run-schemes.workspace = true

anyhow.workspace     = true
glob.workspace       = true
json5.workspace      = true
serde.workspace      = true
serde_json.workspace = true
shlex.workspace      = true
yaml-rust2.workspace = true

[dependencies.toml]
workspace = true
features  = ["parse", "serde"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
