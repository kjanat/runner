#:tombi toml-version = "v1.0.0"

[package]
name                   = "runner-providers"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description            = "Provider declarations for the runner task runner"
readme                 = "../../README.md"
repository.workspace   = true
license.workspace      = true
keywords               = ["automation", "build-tool", "cli", "task-runner"]
categories             = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow     = "1"
glob       = "0.3"
json5      = "1"
serde      = { workspace = true }
serde_json = "1"
shlex      = "2"
toml       = { workspace = true, features = ["parse", "serde"] }
yaml-rust2 = "0.13"

[dependencies.runner-core]
path    = "../core"
version = "0.26.2"

[dependencies.runner-schemes]
path    = "../schemes"
version = "0.26.2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
