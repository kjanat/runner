#:tombi toml-version = "v1.0.0"

[package]
name                   = "runner-run"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description            = "Universal project task runner"
documentation          = "https://docs.rs/runner-run"
readme                 = "../../README.md"
homepage               = "https://runner.kjanat.dev"
repository             = "https://github.com/kjanat/runner"
license                = "MIT"
keywords               = ["automation", "build-tool", "cli", "task-runner"]
categories             = ["command-line-utilities", "development-tools"]
build                  = "build.rs"
include                = ["/LICENSE", "/build.rs", "/man", "/src"]
default-run            = "runner"
autobins               = false

[package.metadata]
authors     = [{ name = "Kaj Kowalski", email = "info+runner@kajkowalski.nl" }]
schema-base = "https://kjanat.github.io/runner/schemas"

[package.metadata.binstall]
pkg-url = "{repo}/releases/download/v{version}/runner-v{version}-{target}{archive-suffix}"
pkg-fmt = "tgz"
bin-dir = "{bin}{binary-ext}"

[package.metadata.npm]
name        = "runner-run"
subpkgscope = "@runner-run"
bugs        = { "url" = "https://github.com/kjanat/runner/issues" }
repository  = { "type" = "git", "url" = "git+https://github.com/kjanat/runner.git" }
engines     = { "node" = ">=18" }

[lib]
name = "runner"
path = "src/lib.rs"

[[bin]]
name = "runner"
path = "src/main.rs"

[[bin]]
name              = "run"
path              = "src/bin/run.rs"
required-features = ["run"]

[[test]]
name = "builtin_verb_dispatch"
path = "../../tests/builtin_verb_dispatch.rs"

[[test]]
name = "architecture_compliance"
path = "../../tests/architecture_compliance.rs"

[[test]]
name = "chain_integration"
path = "../../tests/chain_integration.rs"

[[test]]
name = "doctor_env"
path = "../../tests/doctor_env.rs"

[[test]]
name = "info_deprecation"
path = "../../tests/info_deprecation.rs"

[[test]]
name = "install_collision"
path = "../../tests/install_collision.rs"

[[test]]
name = "install_task_fallback"
path = "../../tests/install_task_fallback.rs"

[[test]]
name = "nested_dispatch"
path = "../../tests/nested_dispatch.rs"

[[test]]
name = "nested_warnings"
path = "../../tests/nested_warnings.rs"

[[test]]
name = "quiet_dispatch"
path = "../../tests/quiet_dispatch.rs"

[[test]]
name = "runtime_override"
path = "../../tests/runtime_override.rs"

[[test]]
name = "spawn_diagnostics"
path = "../../tests/spawn_diagnostics.rs"

[[test]]
name = "version_output"
path = "../../tests/version_output.rs"

[[test]]
name = "workspace_dispatch"
path = "../../tests/workspace_dispatch.rs"

[dependencies]
runner-run-core.workspace      = true
runner-run-providers.workspace = true

actions-rs.workspace       = true
json-schema-sort.workspace = true

anyhow.workspace        = true
colored.workspace       = true
glob.workspace          = true
json5.workspace         = true
schemars.workspace      = true
semver.workspace        = true
serde.workspace         = true
serde_json.workspace    = true
shlex.workspace         = true
terminal_size.workspace = true
unicode-width.workspace = true
yaml-rust2.workspace    = true

[dependencies.clap]
workspace = true
features  = ["cargo", "derive", "env", "string", "wrap_help"]

[dependencies.clap_complete]
workspace = true
features  = ["unstable-dynamic"]

[dependencies.clap_mangen]
workspace = true
optional  = true

[dependencies.lsp-server]
workspace = true
optional  = true

[dependencies.lsp-types]
workspace = true
optional  = true

[dependencies.toml]
workspace = true
features  = ["display", "parse", "serde"]

[dependencies.toml_parser]
workspace = true
features  = ["std"]
optional  = true

[build-dependencies]
serde.workspace = true

[build-dependencies.toml]
workspace = true
features  = ["parse", "serde"]

[features]
default = ["lsp", "run"]
# Editor language server (`runner lsp`): hover, completion, and diagnostics for
# runner.toml. Pulls in `schema` to reuse field docs as the single source of truth.
lsp     = ["dep:lsp-server", "dep:lsp-types", "dep:toml_parser"]
man     = ["dep:clap_mangen"]
run     = []

[lints]
workspace = true
