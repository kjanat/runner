---
name: docker-release
run-name: ${{ format('docker {0} {1}', case(inputs.readme-only, 'readme', case(inputs.dry-run, 'dry-run', 'publish')), inputs.tag) }}
permissions: { contents: read }
env: { DRY_RUN: "${{ inputs.dry-run || 'false' }}" }

on:
  workflow_call: { inputs: { tag: { required: true, type: string }, run-id: { required: true, type: string } } }
  workflow_dispatch:
    inputs:
      tag: { description: Release tag to publish (e.g. v0.26.0), required: true, type: string }
      run-id:
        description: |-
          release.yml run ID that produced the dist artifact for this tag.
          Required unless readme-only is enabled. Find it via:

          `gh run list --workflow=release.yml --branch=<tag> --status=success`.
        required: false
        type: string
      readme-only: { description: Publish only the Docker Hub overview, required: true, default: false, type: boolean }
      dry-run: { description: Build or render without publishing, required: true, default: false, type: boolean }

jobs:
  publish:
    name: publish image
    runs-on: ubuntu-latest
    if: inputs.readme-only != true && startsWith(inputs.tag, 'v')
    # Serialize so dispatch and the release pipeline can't race the same tag.
    concurrency: { group: "docker-publish-${{ inputs.tag }}", cancel-in-progress: false }
    permissions: { contents: read, packages: write, actions: read, id-token: write, attestations: write }
    environment: { name: docker, url: "https://hub.docker.com/r/${{ github.repository }}" }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: ".github/scripts\n.github/actions\n.github/docker"
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/dist-artifact
        with: { run-id: "${{ inputs.run-id }}", token: "${{ secrets.GITHUB_TOKEN }}" }

      - name: prepare build context
        run: bash .github/scripts/docker.sh prepare

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        name: docker/login-action (docker.io)
        with: { registry: docker.io, username: "${{ vars.DOCKERHUB_USERNAME }}", password: "${{ secrets.DOCKERHUB_TOKEN }}" }
      - uses: docker/login-action@v4
        name: docker/login-action (ghcr.io)
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/metadata-action@v6
        id: meta
        env: { DOCKER_METADATA_ANNOTATIONS_LEVELS: "index,manifest" }
        with:
          images: |
            docker.io/${{ github.repository }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}

      - name: build image
        id: build
        env: { META: "${{ toJSON(steps.meta.outputs) }}" }
        run: bash .github/scripts/docker.sh build

      - name: attest image provenance (ghcr.io)
        if: env.DRY_RUN == 'false'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: attest image provenance (docker.io)
        if: env.DRY_RUN == 'false'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: docker.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}

      # The build needs no emulation (COPY only); executing the arm64 image on an amd64 runner does.
      - uses: docker/setup-qemu-action@v4
        if: env.DRY_RUN == 'false'
        id: setup-qemu

      - name: verify published manifest
        if: steps.setup-qemu.outcome == 'success'
        env: { TAGS: "${{ steps.meta.outputs.tags }}" }
        run: bash .github/scripts/docker.sh verify

  readme:
    name: publish readme
    needs: [publish]
    if: always() && startsWith(inputs.tag, 'v') && (inputs.readme-only == true || needs.publish.result == 'success')
    runs-on: ubuntu-latest
    concurrency: { group: docker-readme, cancel-in-progress: false }
    environment: { name: docker }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: ".github/scripts\n.github/docker"
          sparse-checkout-cone-mode: false

      - name: render the Docker Hub overview
        env: { RELEASE_TAG: "${{ inputs.tag }}" }
        run: bash .github/scripts/docker.sh readme

      - uses: peter-evans/dockerhub-description@v5
        if: env.DRY_RUN == 'false'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ github.repository }}
          readme-filepath: .github/docker/README.rendered.md
          short-description: Universal project task runner. Tab-completes (almost) everything.
