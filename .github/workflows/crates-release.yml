---
name: crates-release
run-name: ${{ format('crates publish {0}', inputs.tag) }}

on:
  workflow_call: { inputs: { tag: { required: true, type: string }, run-id: { required: false, type: string, default: "" } } }
  workflow_dispatch:
    inputs:
      tag: { description: Release tag to publish (e.g. vX.Y.Z), required: true, type: string }
      run-id: { description: release.yml run ID with a man-pages artifact; empty rebuilds them, required: false, default: "", type: string }
      dry-run: { description: Dry run only (no upload to crates.io), required: false, default: false, type: boolean }

env:
  RELEASE_TAG: ${{ inputs.tag }}
  CARGO_TERM_COLOR: always

permissions: {}

concurrency: { group: "crates-release-${{ inputs.tag }}", cancel-in-progress: false }

jobs:
  setup:
    name: verify crates
    if: github.repository == 'kjanat/runner'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read, actions: read }
    outputs:
      version: ${{ steps.verify.outputs.version }}
      man-crate: ${{ steps.verify.outputs.name }}
      man-dir: ${{ steps.verify.outputs.man_dir }}
      crates: ${{ steps.order.outputs.crates }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: "refs/tags/${{ env.RELEASE_TAG }}", persist-credentials: false }
      - uses: actions/checkout@v7
        with: { ref: "${{ github.event.repository.default_branch }}", persist-credentials: false, path: helpers, sparse-checkout: .github/scripts }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: verify tag matches Cargo.toml version
        shell: "bash -euxo pipefail {0}"
        id: verify
        run: |
          tag_version="${RELEASE_TAG#v}"
          metadata=$(cargo metadata --no-deps --format-version 1)
          fields=$(jq -er '.workspace_default_members[0] as $id | .packages[] | select(.id == $id) | "\(.name) \(.version) \(.manifest_path)"' <<<"${metadata}")
          read -r name manifest_version manifest_path <<<"${fields}"
          manifest_path="${manifest_path#"${GITHUB_WORKSPACE}/"}"
          if [[ "${tag_version}" != "${manifest_version}" ]]; then
            echo "::error file=${manifest_path}::version does not match release tag"
            echo "error: tag ${RELEASE_TAG} (${tag_version}) does not match ${manifest_path} version ${manifest_version}" >&2
            exit 1
          fi
          echo "ok: tag ${RELEASE_TAG} matches ${manifest_path} version ${manifest_version}"
          {
            echo "name=${name}"
            echo "version=${manifest_version}"
            echo "man_dir=$(dirname "${manifest_path}")/man"
          } >> "${GITHUB_OUTPUT}"

      - name: download man pages
        if: inputs.run-id != ''
        uses: actions/download-artifact@v8
        with:
          name: man-pages
          path: ${{ steps.verify.outputs.man_dir }}
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}

      - name: build man pages
        if: inputs.run-id == ''
        env: { MAN_DIR: "${{ steps.verify.outputs.man_dir }}" }
        run: cargo man --output "${MAN_DIR}"

      - run: cargo dirtypub --dry-run

      - id: order
        run: bash helpers/.github/scripts/crates.sh order

  publish:
    name: publish ${{ matrix.crate }}
    needs: setup
    if: inputs.dry-run != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read, id-token: write, actions: read }
    environment: { name: crates-io, url: "https://crates.io/crates/${{ matrix.crate }}/${{ needs.setup.outputs.version }}" }
    strategy: { max-parallel: 1, fail-fast: true, matrix: { crate: "${{ fromJSON(needs.setup.outputs.crates) }}" } }
    env: { CRATE: "${{ matrix.crate }}", VERSION: "${{ needs.setup.outputs.version }}" }
    steps:
      - uses: actions/checkout@v7
        with: { ref: "refs/tags/${{ env.RELEASE_TAG }}", persist-credentials: false }
      - uses: actions/checkout@v7
        with: { ref: "${{ github.event.repository.default_branch }}", persist-credentials: false, path: helpers, sparse-checkout: .github/scripts }

      - id: state
        run: bash helpers/.github/scripts/crates.sh state "${CRATE}" "${VERSION}"

      - if: steps.state.outputs.published == 'false'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.state.outputs.published == 'false'
        uses: Swatinem/rust-cache@v2

      - name: download man pages
        if: steps.state.outputs.published == 'false' && matrix.crate == needs.setup.outputs.man-crate && inputs.run-id != ''
        uses: actions/download-artifact@v8
        with:
          name: man-pages
          path: ${{ needs.setup.outputs.man-dir }}
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}

      - name: build man pages
        if: steps.state.outputs.published == 'false' && matrix.crate == needs.setup.outputs.man-crate && inputs.run-id == ''
        env: { MAN_DIR: "${{ needs.setup.outputs.man-dir }}" }
        run: cargo man --output "${MAN_DIR}"

      - name: mint crates.io token (trusted publishing)
        if: steps.state.outputs.published == 'false' && steps.state.outputs.new == 'false'
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: cargo publish
        if: steps.state.outputs.published == 'false'
        env: { CARGO_REGISTRY_TOKEN: "${{ case(steps.state.outputs.new == 'true', secrets.CARGO_REGISTRY_TOKEN, steps.auth.outputs.token) }}" }
        run: bash helpers/.github/scripts/crates.sh publish "${CRATE}" "${VERSION}"
