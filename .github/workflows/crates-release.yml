---
name: crates-release
run-name: ${{ format('crates publish {0}', inputs.tag) }}

on:
  workflow_call: { inputs: { tag: { required: true, type: string }, run-id: { required: false, type: string, default: "" } } }
  workflow_dispatch:
    inputs:
      tag: { description: Release tag to publish (e.g. vX.Y.Z), required: true, type: string }
      run-id: { description: release.yml run ID with a man-pages artifact; empty rebuilds them, required: false, default: "", type: string }
      dry-run: { description: Verify packages without uploading, required: false, default: false, type: boolean }

permissions: {}

concurrency: { group: "crates-release-${{ inputs.tag }}", cancel-in-progress: false }

env:
  RELEASE_TAG: ${{ inputs.tag }}
  RUN_ID: ${{ inputs.run-id }}
  MAN_DIR: source/crates/cli/man
  PROOF_DIR: ${{ github.workspace }}/verified-crates
  CARGO_TERM_COLOR: always

jobs:
  setup:
    name: verify packaged crates
    if: github.repository == 'kjanat/runner'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: { contents: read, actions: read }
    outputs:
      version: ${{ steps.packages.outputs.version }}
      crates: ${{ steps.packages.outputs.crates }}
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: "refs/tags/${{ env.RELEASE_TAG }}", persist-credentials: false, path: source }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: source }
      - name: download man pages
        if: env.RUN_ID != ''
        uses: actions/download-artifact@v8
        with: { name: man-pages, path: "${{ env.MAN_DIR }}", run-id: "${{ env.RUN_ID }}", github-token: "${{ github.token }}" }
      - name: build man pages
        if: env.RUN_ID == ''
        working-directory: source
        run: cargo man --output "${GITHUB_WORKSPACE}/${MAN_DIR}"
      - name: build every packaged crate without uploading
        id: packages
        uses: $/.github/actions/crates-verify
        with: { source-dir: source, proof-dir: "${{ env.PROOF_DIR }}", tag: "${{ env.RELEASE_TAG }}", helper-sha: "${{ job.workflow_sha }}" }
      - name: retain verified archives and report
        id: artifact
        uses: actions/upload-artifact@v7
        with:
          name: verified-crates-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PROOF_DIR }}
          retention-days: 14
          if-no-files-found: error

  publish:
    name: publish to crates.io
    needs: setup
    if: inputs.dry-run != true
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions: { contents: read, id-token: write, actions: read }
    environment: { name: crates-io, url: "https://crates.io/crates/runner-run/${{ needs.setup.outputs.version }}" }
    steps:
      - uses: actions/checkout@v7
        with: { ref: "refs/tags/${{ env.RELEASE_TAG }}", persist-credentials: false, path: source }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: source }
      - name: download this run's verified packages
        uses: actions/download-artifact@v8
        with: { artifact-ids: "${{ needs.setup.outputs.artifact_id }}", path: "${{ env.PROOF_DIR }}", merge-multiple: true }
      - name: download man pages
        if: env.RUN_ID != ''
        uses: actions/download-artifact@v8
        with: { name: man-pages, path: "${{ env.MAN_DIR }}", run-id: "${{ env.RUN_ID }}", github-token: "${{ github.token }}" }
      - name: build man pages
        if: env.RUN_ID == ''
        working-directory: source
        run: cargo man --output "${GITHUB_WORKSPACE}/${MAN_DIR}"
      - name: mint crates.io token (trusted publishing)
        id: auth
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@v1
      - name: cargo publish
        uses: $/.github/actions/crates-publish
        with:
          source-dir: source
          proof-dir: ${{ env.PROOF_DIR }}
          crates: ${{ needs.setup.outputs.crates }}
          version: ${{ needs.setup.outputs.version }}
          token: ${{ steps.auth.outputs.token }}
          bootstrap-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
